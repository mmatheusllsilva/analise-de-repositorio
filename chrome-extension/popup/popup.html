<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub IA Analyzer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div id="popup-loading" class="loading-overlay">Carregando...</div>
      <header class="app-header">
        <div class="brand-stack">
          <div class="brand-title">GitHub IA Analyzer</div>
          <div class="brand-subtitle">Análise de segurança e qualidade de código</div>
        </div>

        <div id="auth-status" class="auth-panel">
          <div id="not-logged-in" class="auth-card">
            <button id="login-btn" class="button-primary">Login com GitHub</button>
          </div>

          <div id="logged-in" class="auth-card" style="display:none">
            <div class="user-row">
              <img id="user-avatar" alt="avatar" width="36" height="36" />
              <div class="user-text">
                <span id="user-name" class="user-name">Usuário</span>
                <span class="user-label">Conectado</span>
              </div>
            </div>
            <button id="logout-btn" class="button-secondary">Logout</button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section id="repo-selection" class="card-section accent-coral"></section>
        <section id="analysis-actions" class="card-section accent-purple"></section>
        <section id="analysis-result" class="card-section accent-coral"></section>
        <section id="future-insights" class="card-section accent-purple">
          <div class="placeholder-card">
            <div class="placeholder-text">
              <span class="placeholder-title">Ver insights completos</span>
              <span class="placeholder-note">Em breve: gráficos e exportação em PDF.</span>
            </div>
            <button class="button-secondary" disabled>Ver insights completos</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
